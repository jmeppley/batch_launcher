[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "batch_launcher"
dynamic = ["version"]
description = "Python script to fragment tasks for parallel execution"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "John Eppley", email = "jmeppley@gmail.com" },
]
maintainers = [
  { name = "John Eppley", email = "jmeppley@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "http://github.com/jmeppley/batch_launcher"
Download = "http://github.com/jmeppley/batch_launcher"

[project.scripts]
batch_launcher = "batch_launcher:main"

[tool.setuptools]
py-modules = ["batch_launcher"]

[tool.setuptools.dynamic]
version = { attr = "batch_launcher.__version__" }
